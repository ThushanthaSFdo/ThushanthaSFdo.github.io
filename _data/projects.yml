labyl:
  title: Labyl
  name: labyl
  desc: "LABYL (Learn About Buildings You Love) is an innovative architectural app that allows users to identify and explore buildings by simply taking a photo. With a database of over 500 structures, it provides historical insights, architectural details, and external resources, making New York's architecture accessible to everyone."
  tags: ["Swift", "API", "UserDefaults"]
  img: assets/images/projects/labyl.png
  status: "Active"

willows:
  title: Willows AMS
  name: willows
  desc: "Willows is a secure, cloud-hosted mobile app that enhances communication between property owners, managers, and tenants. It facilitates efficient management of daily activities, including rent collection and service requests, while providing a clear channel for notifications and complaints."
  tags: ["Swift", "API", "Database"]
  img: assets/images/projects/willows.png
  status: "Active"

bloom:
  title: Bloom
  name: bloom
  desc: "Bloom is a comprehensive student and institute management system designed for a leading educational institute in Sri Lanka, serving over 5,000 users monthly. It facilitates class notifications, fee submissions, and access to live classes, enhancing the academic experience for students."
  tags: ["Swift", "API", "Alamofire", "Firebase", "APN", "CalendarKit", "EventKit", "AVKit", "AVFoundation"]
  img: assets/images/projects/bloom.png
  status: "Active"

ehanu:
  title: eHanu
  name: ehanu
  desc: "The app streamlines the prescription process by allowing doctors to create electronic prescriptions that patients can easily send to their preferred pharmacies. With features for partial medicine fulfillment and comprehensive prescription history, we enhance patient care and pharmacy communication, ensuring a seamless healthcare experience."
  tags: ["Swift", "API", "SQLite"]
  img: assets/images/projects/ehanu.png
  status: "Active"

github-replica:
  title: Github Replica
  name: github-replica
  desc: "This project showcases the fundamentals of Swift UIKit development, featuring a fully programmatic UI. It includes network calls to retrieve and display JSON data, image caching, pagination, and custom alerts. Enhanced with collection views and search controllers, it offers a dynamic user experience with UITableViewDiffableDataSource."
  tags: ["Swift", "API", "UICollectionViewDiffableDataSource", "UserDefaults", "NSCache"]
  img: assets/images/projects/github-replica.png
  status: "Active"

uikit-dashboard:
  title: UIKit Dashboard
  name: uikit-dashboard
  desc: "This reference project showcases various approaches to creating UITableViews and UICollectionViews in Swift. It features diverse cell layouts and demonstrates multiple techniques for implementing UIFlowLayout, catering to different design requirements. Ideal for developers seeking to enhance their understanding of dynamic UI components in iOS development."
  tags: ["Swift", "UICollectionView", "UITableView", "UICollectionReusableView", "UITableViewHeaderFooterView", "UICollectionViewFlowLayout"]
  img: assets/images/projects/uikit-dashboard.png
  status: "Active"

textrecon:
  title: TextRecon
  name: textrecon
  desc: "This project provides an efficient solution for converting text from captured images or those stored in the device gallery, achieving accuracy rates between 85% and 100%. Currently supporting only English characters, it streamlines text extraction for various applications."
  tags: ["Swift", "VisionKit", "VNImageHandler"]
  img: assets/images/projects/textrecon.png
  status: "Active"

galaxy-saga:
  title: Galaxy Saga
  name: galaxy-saga
  desc: "Embark on an exhilarating journey through the cosmos in this single-player space shooter game! Navigate your ship, battle fierce enemies, and collect power-ups to boost your score, energy, and health. Can you survive the galactic onslaught and emerge as the ultimate space champion?"
  tags: ["Swift", "UIKit", "SpriteKit", "GameplayKit"]
  img: assets/images/projects/galaxy-saga.png
  status: "Active"

catchfishy:
  title: Catch Fishy
  name: catchfishy
  desc: "Dive into this exciting 2D fish-catching game, built with Swift! Compete for points by catching fish while avoiding bones. Experience the thrill of fishing like never before!"
  tags: ["Swift", "UIKit", "SpriteKit", "GameplayKit"]
  img: assets/images/projects/catchfishy.png
  status: "Pause"

