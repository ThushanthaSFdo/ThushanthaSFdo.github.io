tic-tac-toe:
  title: Tic Tac Toe
  name: tic-tac-toe
  desc: "Challenge a friend in this engaging two-player Tic Tac Toe game! Compete for the highest score in each session while enjoying a classic gameplay experience. With simple mechanics, it's perfect for players of all ages looking for a quick and fun challenge."
  tags: ["Swift", "UIKit"]
  img: assets/images/projects/tic-tac-toe.png
  status: "Active"

